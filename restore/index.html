<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Water로 이동합니다</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=../stillwater/">
<script>
(function () {
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (list) {
        list.forEach(function (reg) {
          if (reg.scope.indexOf('/restore/') > -1) reg.unregister();
        });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { if (k.indexOf('restore-') === 0) caches.delete(k); });
      }).catch(function () {});
    }
  } catch (e) {}
  window.location.replace('../stillwater/');
})();
</script>
</head>
<body style="margin:0;background:#FAF6EE;color:#4A4137;font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo',sans-serif;">
  <p style="padding:40px 24px;font-size:15px;line-height:1.8;">
    잠시만 기다려 주세요. 새 주소 <a href="../stillwater/" style="color:#7C6A55;">Still Water · 익명 고민 상담소</a>로 이동합니다.
  </p>
</body>
</html>
